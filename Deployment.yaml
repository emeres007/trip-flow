apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trip-flow
  template:
    metadata:
      labels:
        app: trip-flow
    spec:
      containers:
        - name: trip-flow
          image: emeres/trip-flow:latest
          ports:
            - containerPort: 8080